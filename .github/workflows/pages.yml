# yaml-language-server: $schema=../../.vscode/github-workflow.schema.json
# One-time setup: repository Settings > Pages > Source > GitHub Actions.
# configure-pages cannot enable a new Pages site with the default GITHUB_TOKEN.
name: Deploy Orbit to GitHub Pages

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node for lab checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check learning engine
        run: node --test tests/lab-engine.test.cjs tests/lab-course.test.cjs
      - name: Configure GitHub Pages (requires Pages enabled in repository Settings)
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
